# Configuration shared by all environments.
# Values defined here are the starting point; each environment can override them.

# Physics tick rate (Hz). Uses 1.0 / tick_rate as Fixed duration.
tick_rate = 60.0

# Log filter syntax matching `RUST_LOG`.
log_filter = "warn,bevy_lightyear_game=debug,lightyear=info"

# SpacetimeDB instance the client connects to, and the module name it was
# published under (`./scripts/stdb.sh publish`). The server runs via
# `docker compose up -d spacetimedb`.
spacetime_uri = "ws://127.0.0.1:3000"
spacetime_module = "bevymmo"

[server]
# Address where the server binds the UDP socket.
bind_addr = "0.0.0.0:5051"

[client]
# Server address that the client connects to.
server_addr = "127.0.0.1:5051"
# Local address bound by the client (0.0.0.0:0 = ephemeral port).
client_addr = "0.0.0.0:0"

# NOTE: `database_url` has no default. It must be provided by:
#   - config/development.toml or config/production.toml (local/non-sensitive values)
#   - config/local.toml (gitignored, local secrets)
#   - env vars (e.g. DATABASE_URL for docker production)
