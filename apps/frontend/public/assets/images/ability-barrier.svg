<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="barrierGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#70e000"/>
      <stop offset="40%" stop-color="#38b000"/>
      <stop offset="75%" stop-color="#007200"/>
      <stop offset="100%" stop-color="#004b23"/>
    </radialGradient>
    <filter id="glowBarrier">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="80" height="80" rx="40" fill="#08131d"/>
  <circle cx="40" cy="40" r="38" stroke="#d0ae61" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Shield Outline -->
  <path d="M40 16 L62 26 C62 48 52 60 40 68 C28 60 18 48 18 26 Z" fill="url(#barrierGrad)" stroke="#d0ae61" stroke-width="2" filter="url(#glowBarrier)"/>
  <!-- Runic Tree/Chevron inside Shield -->
  <path d="M40 22 L40 60" stroke="#d8f3dc" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 32 L52 24" stroke="#d8f3dc" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 32 L28 24" stroke="#d8f3dc" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 44 L54 36" stroke="#d8f3dc" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 44 L26 36" stroke="#d8f3dc" stroke-width="2" stroke-linecap="round"/>
</svg>
