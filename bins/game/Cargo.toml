[package]
name = "bevy_lightyear_game"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["client"]
client = [
    "bevy/default",
    "bevy/jpeg",
    "dep:bevymmo_client",
    "dep:bevymmo_presentation",
]

[dependencies]
bevy = { workspace = true }
lightyear = { workspace = true }
serde = { workspace = true }
clap = { workspace = true }
config = { workspace = true }
bevymmo_app_support = { path = "../../crates/app-support" }
bevymmo_network = { path = "../../crates/network" }
bevymmo_gameplay = { path = "../../crates/gameplay", features = ["bevy"] }
bevymmo_content = { path = "../../crates/content" }
bevymmo_client = { path = "../../crates/client", optional = true }
bevymmo_presentation = { path = "../../crates/presentation", optional = true }

[[bin]]
name = "game"
path = "src/main.rs"

[lints]
workspace = true
