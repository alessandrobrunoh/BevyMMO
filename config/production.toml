# Production environment.
# Server runs on host 193.70.42.29; clients connect to that IP.
# `database_url` should NOT be put here: it is injected as env var by deployment
# (e.g. docker-compose: DATABASE_URL=postgresql://...).

log_filter = "warn,bevy_lightyear_game=info,lightyear=warn"

[server]
# Accepts connections on all interfaces.
bind_addr = "0.0.0.0:5051"

[client]
# Client targets the production server.
server_addr = "193.70.42.29:5051"

[gateway]
# Accepts connections on all interfaces inside Docker container.
bind_addr = "0.0.0.0:8081"
# TODO: set to the real deployed frontend origin — the `default.toml` value
# (`http://localhost:4200`) is a dev-only placeholder and will reject every
# browser request in production. Override here or via `GATEWAY__CORS_ORIGIN`.
cookie_secure = true
