services:
  spacetimedb:
    image: clockworklabs/spacetime:latest
    restart: unless-stopped
    command: ["start", "--listen-addr", "0.0.0.0:3000", "--data-dir", "/stdb"]
    ports:
      - "3000:3000"
    volumes:
      - spacetime_data:/stdb

  gateway:
    image: ghcr.io/alessandrobrunoh/eivar_backend:latest
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - APP_ENV=production
      - GATEWAY__BIND_ADDR=0.0.0.0:8081
      - GATEWAY__LOG_FORMAT=json
      - GATEWAY__CORS_ORIGIN=http://193.70.42.29:5001
      - GATEWAY__COOKIE_SECURE=false
      - SPACETIME_URI=ws://spacetimedb:3000
      - SPACETIME_MODULE=bevymmo-v2
    depends_on:
      - spacetimedb

  frontend:
    image: ghcr.io/alessandrobrunoh/eivar_frontend:latest
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5001:80"
    depends_on:
      - gateway

volumes:
  spacetime_data:
