<app-auth-shell
  mode="login"
  title="Enter Eivar"
>
  <form class="auth-form" (ngSubmit)="onSubmit()" novalidate>
    @if (errorMessage()) {
      <div class="auth-form__message auth-form__message--error" role="alert" aria-live="assertive">
        <span class="material-symbols-outlined" aria-hidden="true">warning</span>
        {{ errorMessage() }}
      </div>
    }

    <div class="auth-form__field">
      <label for="login-email">Account email</label>
      <div class="auth-form__input-wrap">
        <input
          id="login-email"
          type="email"
          name="email"
          autocomplete="email"
          inputmode="email"
          enterkeyhint="next"
          placeholder="wayfarer@eivar.online"
          [ngModel]="email()"
          (ngModelChange)="email.set($event); errorMessage.set(null)"
          required
        />
      </div>
    </div>

    <div class="auth-form__field">
      <div class="auth-form__label-row">
        <label for="login-password">Password</label>
        <a routerLink="/register" class="auth-form__help-link">Need an account?</a>
      </div>
      <div class="auth-form__input-wrap">
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          autocomplete="current-password"
          enterkeyhint="done"
          placeholder="Your secret glyph"
          [ngModel]="password()"
          (ngModelChange)="password.set($event); errorMessage.set(null)"
          required
          minlength="8"
        />
        <button
          type="button"
          class="auth-form__visibility"
          (click)="toggleShowPassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          <img
            [src]="showPassword() ? 'assets/images/auth-eye-off.png' : 'assets/images/auth-eye.png'"
            alt=""
            aria-hidden="true"
          />
        </button>
      </div>
    </div>

    <label class="auth-form__remember">
      <input type="checkbox" name="rememberMe" [ngModel]="rememberMe()" (ngModelChange)="rememberMe.set($event)" />
      <span>Keep this sanctum remembered</span>
    </label>

    <app-eivar-button variant="ornate" type="submit" [fullWidth]="true" [loading]="isLoading()">
      Enter the world
    </app-eivar-button>

    <p class="auth-form__switch">New to Eivar? <a routerLink="/register">Forge your account</a></p>
  </form>
</app-auth-shell>
