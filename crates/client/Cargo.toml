[package]
name = "bevymmo_client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bevy = { workspace = true, features = ["default"] }
lightyear = { workspace = true }
bevymmo_shared = { path = "../shared" }
bevymmo_domain = { path = "../domain" }

# SpacetimeDB client. Pinned to the same patch as the module and the CLI that
# generates `src/stdb/module_bindings/`: the generated code is stamped with the
# CLI version and calls into `spacetimedb_sdk::__codegen`, an internal API with
# no stability promise across patches.
spacetimedb-sdk = "=2.8.1"
# `DbConnection` callbacks fire on the SDK's thread and must not touch the Bevy
# `World`. They hand rows to a channel that a Bevy system drains instead.
crossbeam-channel = "0.5"

[lints]
workspace = true
