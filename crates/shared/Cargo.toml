[package]
name = "bevymmo_shared"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bevy = { workspace = true, features = ["bevy_window", "serialize"] }
lightyear = { workspace = true, features = [
    "interpolation",
    "prediction",
    "replication",
    "input_native",
] }
serde = { workspace = true }
