[package]
name = "bevymmo_gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Shared app helpers: layered `config/*.toml` + path resolution. Keeps the
# gateway consistent with `bins/game` on how settings are loaded.
bevymmo_app_support = { path = "../../crates/app-support" }

axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# Pinned exactly, same reason as `crates/client/Cargo.toml`: the generated
# `module_bindings` call into `spacetimedb_sdk::__codegen`, an internal API
# with no compatibility guarantee across even patch versions.
spacetimedb-sdk = "=2.8.1"

[[bin]]
name = "gateway"
path = "src/main.rs"

[lints]
workspace = true
